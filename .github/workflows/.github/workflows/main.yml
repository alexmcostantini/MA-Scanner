name: Daily Moving Average Calculation

on:
  schedule:
    - cron: '0 21 * * 1-5' # Runs at 21:00 UTC, Mon-Fri
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas yfinance

      - name: Run MA Script
        run: python ma_calculator.py
